# Checks every pull request and every push to main: the Python tests (with Stockfish, so the
# engine tests run too), the web app's typecheck and lint (which includes the raw-color check),
# and that the server's Docker image builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    # Postgres 16 to match the runner's own pg_dump (the backup test runs it).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      KNIGHTLY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The official Stockfish build, downloaded once and then restored from the Actions cache
      # (about a second, where apt took eleven), and pinned: bump the version in both places.
      - name: Restore Stockfish
        id: stockfish
        uses: actions/cache@v4
        with:
          path: ~/stockfish
          key: stockfish-17.1-ubuntu-x86-64-avx2
      - name: Download Stockfish
        if: steps.stockfish.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/stockfish
          curl -sSfL https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar \
            | tar -xO stockfish/stockfish-ubuntu-x86-64-avx2 > ~/stockfish/stockfish
          chmod +x ~/stockfish/stockfish
      - run: echo "$HOME/stockfish" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm export:ios
