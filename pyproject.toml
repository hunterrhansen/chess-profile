[project]
name = "chessprofile"
version = "0.1.0"
description = "Aggregate your Chess.com, Lichess and over-the-board chess data into one SQLite database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",
    "fastapi>=0.142.2",
    "uvicorn>=0.30",
]

[project.scripts]
chessprofile = "chessprofile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
