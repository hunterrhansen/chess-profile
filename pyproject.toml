[project]
name = "knightly"
version = "0.1.0"
description = "Aggregate your Chess.com, Lichess and over-the-board chess data into one SQLite database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",
    "fastapi>=0.142.2",
    "fsrs>=6.3,<7",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "sentry-sdk[fastapi]>=2.20",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# `knightly fsrs-optimize` (tuning the review deck to your answers) needs PyTorch: large, so opt-in.
optimizer = ["fsrs[optimizer]>=6.3,<7"]

[project.scripts]
knightly = "knightly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
