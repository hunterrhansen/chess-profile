# Runs the server image and a Postgres for it locally -> http://localhost:8000
#   docker compose up --build
# To start from your own data (a SQLite chess.db from before Postgres):
#   docker compose run --rm -v "$PWD:/import:ro" web knightly import-sqlite /import/chess.db
# /data holds backups/ and your own sounds/. On a server, the database is Supabase instead
# of the `db` service (Phase 4).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: knightly
      POSTGRES_PASSWORD: knightly
      POSTGRES_DB: knightly
    volumes:
      - knightly-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "knightly"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  web:
    build: .
    image: knightly
    environment:
      KNIGHTLY_DATABASE_URL: postgresql://knightly:knightly@db/knightly
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${KNIGHTLY_DATA:-knightly-data}:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  knightly-db:
  knightly-data:
